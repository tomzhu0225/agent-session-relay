[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-session-relay"
version = "0.2.0"
description = "Browse and resume local coding-agent sessions across CLI tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Bowen Zhu"}]
dependencies = []
keywords = ["ai-agents", "cli", "codex", "grok", "claude", "session-handoff"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Tools",
]

[project.urls]
Homepage = "https://github.com/tomzhu0225/agent-session-relay"
Repository = "https://github.com/tomzhu0225/agent-session-relay"
Issues = "https://github.com/tomzhu0225/agent-session-relay/issues"

[project.scripts]
relay = "agent_relay.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
